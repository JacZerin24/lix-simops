services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      - APP_ENV=development
      - DATABASE_URL=sqlite:///./simops.sqlite3
    ports:
      - "8000:8000"
    volumes:
      - .:/workspace

  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile
    environment:
      - VITE_API_BASE=http://localhost:8000
      - VITE_WS_BASE=ws://localhost:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend
