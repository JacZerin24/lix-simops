products:
  - id: mlcape
    label: RAP 90-mb MLCAPE
    category: Thermodynamics
    units: J/kg
    description: RAP mixed-layer instability available to the evolving convective threat.
    source_dir: data/raw/meso/mlcape
    pattern: "*.png"

  - id: srh_0_1km
    label: RAP 0–1 km SRH
    category: Kinematics
    units: m²/s²
    description: Low-level storm-relative helicity for near-surface rotation potential.
    source_dir: data/raw/meso/srh_0_1km
    pattern: "*.png"

  - id: srh_0_3km
    label: RAP 0–3 km SRH
    category: Kinematics
    units: m²/s²
    description: Deeper low-level storm-relative helicity useful for QLCS and mesovortex context.
    source_dir: data/raw/meso/srh_0_3km
    pattern: "*.png"

  - id: bulk_shear_0_3km
    label: RAP 0–3 km Bulk Shear + Vectors
    category: Kinematics
    units: kt
    description: 0–3 km vector wind difference with sparse vectors, emphasizing low-level shear relevant to QLCS organization.
    source_dir: data/raw/meso/bulk_shear_0_3km
    pattern: "*.png"

  - id: bulk_shear_0_6km
    label: RAP 0–6 km Bulk Shear
    category: Kinematics
    units: kt
    description: Deep-layer vector wind difference derived directly from RAP winds.
    source_dir: data/raw/meso/bulk_shear_0_6km
    pattern: "*.png"

  - id: goes_ir
    label: GOES-16 Infrared
    category: Satellite / Lightning
    description: ABI Channel 13 cloud-top evolution and upstream convective development.
    source_dir: data/raw/meso/goes_ir
    pattern: "*.png"

  - id: glm_flash_density
    label: GLM Flash Density
    category: Satellite / Lightning
    description: Five-minute observed GLM flash-centroid density with approximate 8/12/15-mile event-area reference rings; evaluate the entire moving route, not only the center point. Not true Flash Extent Density.
    source_dir: data/raw/meso/glm_flash_density
    pattern: "*.png"

  - id: lightningcast
    label: LightningCast
    category: Satellite / Lightning
    units: "%"
    description: Historical LightningCast probability generated from archived ABI inputs with CSPP Geo.
    source_dir: data/raw/meso/lightningcast
    pattern: "*.png"

  - id: mrms_lowest_refl
    label: MRMS Lowest-Altitude Reflectivity
    category: MRMS
    units: dBZ
    description: Multi-radar low-level reflectivity context away from the primary KLIX display.
    source_dir: data/raw/meso/mrms/MergedReflectivityAtLowestAltitude_00.50
    pattern: "*.png"

  - id: mrms_azshear
    label: MRMS 0–2 km Azimuthal Shear
    category: MRMS
    units: s⁻¹
    description: Multi-radar rotation signal for tracking strengthening circulations.
    source_dir: data/raw/meso/mrms/MergedAzShear_0-2kmAGL_00.50
    pattern: "*.png"

  - id: mrms_precip_rate
    label: MRMS Precipitation Rate
    category: MRMS
    units: in/hr
    description: Rain-rate context for outdoor operations and localized flooding concerns.
    source_dir: data/raw/meso/mrms/PrecipRate_00.00
    pattern: "*.png"

  - id: mrms_mesh
    label: MRMS MESH
    category: MRMS
    units: in
    description: Multi-radar hail-size estimate; near-zero values are masked so no-hail areas remain visually quiet.
    source_dir: data/raw/meso/mrms/MESH_00.50
    pattern: "*.png"

  - id: surface_obs
    label: Surface Observations
    category: Surface
    description: Temperature, dewpoint, and wind evolution across southeast Louisiana.
    source_dir: data/raw/meso/surface_obs
    pattern: "*.png"

  - id: forecast_guidance
    label: Forecast Guidance
    category: Guidance
    description: Scenario-specific CAM, ensemble, or probabilistic guidance selected by the exercise team.
    source_dir: data/raw/meso/forecast_guidance
    pattern: "*.png"
