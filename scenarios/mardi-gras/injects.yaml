injects:
  - id: operations-checkin
    at_sim_time: "T+00:05:00"
    kind: partner_message
    title: Operations Check-In
    sender: Mardi Gras Unified Command
    target_team_id: "*"
    body: >-
      Samedi Gras is active and crowds are building along the route. Riders and support crews are
      moving into position. Please provide the current weather picture, expected timing and
      locations of any hazards, confidence, and the key conditions our operations staff should
      monitor ahead of the 4 PM start.

  - id: prestart-confidence
    at_sim_time: "T+00:20:00"
    kind: partner_message
    title: Parade Start Confidence
    sender: Mardi Gras Unified Command
    target_team_id: "*"
    body: >-
      We are about an hour from the scheduled start. Unified Command is assessing staffing and
      staging options. What is your latest forecast for weather affecting the route near 4 PM, your
      confidence and uncertainty, and when should we request the next weather update?

  - id: route-lead-time
    at_sim_time: "T+00:35:00"
    kind: partner_message
    title: Protective-Action Lead Time
    sender: Mardi Gras Unified Command
    target_team_id: "*"
    body: >-
      Our event plan requires substantial lead time if weather threatens outdoor route operations.
      Based on current observations and storm motion, what is the earliest plausible onset of
      lightning, damaging wind, or heavy rainfall along active route segments, and how much lead
      time does the forecast provide? Unified Command will decide when to activate its procedures.

  - id: lightning-framework
    at_sim_time: "T+00:42:00"
    kind: inject
    title: Exercise Reminder — Lightning Threshold Communication
    audience: dss
    body: >-
      This exercise uses partner planning thresholds of 15 miles (enhanced monitoring/preparation),
      12 miles (impending threat), and 8 miles (partner hold/suspension decision), evaluated
      relative to active route/staging areas. Meso and DSS should report observed lightning
      proximity, direction and trend, confidence, and available lead time (potentially 30 minutes
      or more for organized convection). Unified Command retains all protective-action, hold, and
      resumption decisions.

  - id: commit-to-route
    at_sim_time: "T+00:50:00"
    kind: partner_message
    title: Commit-to-Route Weather Brief
    sender: Mardi Gras Unified Command
    target_team_id: "*"
    body: >-
      The first floats are nearly ready to roll. Unified Command is deciding whether and when to
      commit to the route. Please provide your latest route-specific forecast: expected hazard
      onset, magnitude and affected segments, lightning threshold proximity, confidence, and when
      conditions may change. We will make the start/delay decision.

  - id: immediate-decision
    at_sim_time: "T+01:05:00"
    kind: partner_message
    title: Immediate Weather Status for Unified Command
    sender: Mardi Gras Unified Command
    target_team_id: "*"
    body: >-
      Unified Command is making an operational decision now. What is the most significant weather
      threat over the next 30 minutes, which active route areas are most exposed, which
      lightning/warning thresholds have been met or may soon be met, and what confidence and lead
      time do you have? Command will determine the operational response.

  # Historical May 12, 2021 LIX-area storm reports displaced into the
  # exercise clock. observed_at_sim_time preserves the historical event-time
  # offset from the 06:00 UTC source-window start. at_sim_time is an explicit
  # exercise delivery time (generally 1-2 minutes later) and is not claimed to
  # reproduce the exact historical LSR product-ingest timestamp.
  #
  # The later NWS EF0 survey confirmation is intentionally omitted from the
  # live participant timeline because it is hindsight information.
  - id: report-downtown-62mph
    at_sim_time: "T+01:10:00"
    kind: storm_report
    title: 62 mph Wind Gust — Downtown New Orleans
    body: >-
      Downtown Heliport AWOS measured a thunderstorm wind gust of 54 kt (62 mph).
    audience: all
    target_team_id: "*"
    sender: Downtown Heliport AWOS
    report_kind: wind
    lat: 29.952683
    lon: -90.082733
    magnitude: "62 mph"
    source: Downtown Heliport AWOS (7N0)
    observed_at_sim_time: "T+01:09:00"
    plot_on_radar: true
    display_minutes: 60

