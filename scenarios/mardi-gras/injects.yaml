  - id: active-hold
    at_sim_time: "T+01:20:00"
    kind: partner_message
    title: Weather Update During Partner Hold
    sender: Mardi Gras Unified Command
    target_team_id: "*"
    body: >-
      Unified Command has placed parade operations on hold. What are the current lightning, wind,
      and heavy-rain threats to the route and adjacent staging areas? Describe observed trends,
      expected changes over the next 15–30 minutes, uncertainty, and the next useful update time.
      We will determine how to manage the hold and what operational messages to send.

  - id: recovery-question
    at_sim_time: "T+01:35:00"
    kind: partner_message
    title: Weather Update for Resumption Review
    sender: Mardi Gras Unified Command
    target_team_id: "*"
    body: >-
      Unified Command is reviewing the weather before deciding whether operations can resume.
      Please report recent lightning proximity and timing, storm motion, any additional upstream
      threats, remaining forecast uncertainty, and whether the weather factors in our event plan
      appear to be improving or deteriorating. Command will make the resumption decision.

  - id: facilitator-contingency
    at_sim_time: "manual"
    kind: partner_message
    title: Contingency Weather Brief
    sender: Mardi Gras Unified Command
    target_team_id: "*"
    body: >-
      Parade leadership is asking Unified Command whether weather concerns remain elevated while
      the crowd grows restless. Please provide the supporting observations, forecast hazard timing
      and severity, proximity to our established thresholds, and confidence. We will assess the
      delay using our event procedures.
