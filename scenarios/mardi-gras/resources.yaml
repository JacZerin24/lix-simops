resources:
  external:
    google_classroom:
      enabled: true
      class_url: null
      purpose: >-
        Participant launch point for briefing materials, links, reference resources,
        the instruction PowerPoint, and post-exercise reflection. Live scenario timing
        remains authoritative in LIX SimOps.
    shift_log:
      enabled: true
      form_url: null
      owner: Facilitator coworker
      purpose: >-
        Google Form used by each team's DSS Meteorologist to document meaningful
        communications to or from the simulated event coordinator. Responses populate
        the coworker's linked Google Sheet.

  radar:
    primary_site: KLIX
    enabled_products:
      - REF
      - VEL
      - CC
      - ZDR
    interaction:
      - scan stepping
      - elevation stepping
      - looping
      - zoom/pan
      - keyboard shortcuts
      - fullscreen

  meso:
    product_config: meso-products.yaml
    categories:
      - Thermodynamics
      - Kinematics
      - Satellite / Lightning
      - MRMS
      - Surface
    optional_categories:
      - Guidance
    note: >-
      Products with no built frames are omitted from the participant workspace.
      LightningCast remains optional until CSPP Geo output is staged.

  dss:
    show_event_map: false
    show_partner_chat: true
    show_event_schedule: true
    show_decision_log: true
    show_shift_log_link: true
