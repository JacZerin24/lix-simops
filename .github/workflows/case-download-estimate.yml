name: Case Download Estimate

on:
  pull_request:
    paths:
      - "scripts/estimate_case_download.py"
      - ".github/workflows/case-download-estimate.yml"
  workflow_dispatch:

jobs:
  estimate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install boto3
      - run: python scripts/estimate_case_download.py
