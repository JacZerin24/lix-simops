name: Full Endymion Case Build

on:
  workflow_dispatch:

jobs:
  radar:
    strategy:
      fail-fast: false
      matrix:
        product: [REF, VEL, CC, ZDR]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-data.txt

      - name: Install case-building dependencies
        run: pip install -r scripts/requirements-data.txt

      - name: Preflight radar builder
        run: python scripts/build_radar_cache.py --help > /dev/null

      - name: Download KLIX Level II source data
        run: python scripts/prepare_endymion_case.py --scope radar --skip-lightningcast-inputs

      - name: Validate radar source inventory
        run: |
          python scripts/validate_case_inventory.py \
            --strict \
            --scope radar \
            --skip-lightningcast-inputs \
            --json data/raw-case-inventory-radar.json

      - name: Build radar product
        run: |
          python scripts/build_radar_cache.py \
            --scenario-id mardi-gras-dss-001 \
            --input data/raw/nexrad/20221214 \
            --site KLIX \
            --products ${{ matrix.product }} \
            --elevations 0.5 0.9 1.3 \
            --range-km 230 \
            --simulation-date 2027-02-06 \
            --timezone America/Chicago

      - uses: actions/upload-artifact@v4
        with:
          name: endymion-radar-${{ matrix.product }}
          path: |
            data/cache/mardi-gras-dss-001/radar
            data/raw-case-inventory-radar.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 6

  meso:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-data.txt

      - name: Install case-building dependencies
        run: pip install -r scripts/requirements-data.txt

      - name: Preflight meso builder
        run: python scripts/build_meso_cache.py --help > /dev/null

      - name: Download meso source data
        run: python scripts/prepare_endymion_case.py --scope meso --skip-lightningcast-inputs

      - name: Validate meso source inventory
        run: |
          python scripts/validate_case_inventory.py \
            --strict \
            --scope meso \
            --skip-lightningcast-inputs \
            --json data/raw-case-inventory-meso.json

      - name: Build participant-facing meso cache
        run: python scripts/build_endymion_meso_inputs.py

      - uses: actions/upload-artifact@v4
        with:
          name: endymion-meso-stage
          path: |
            data/cache/mardi-gras-dss-001/meso
            data/raw-case-inventory-meso.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 6

  package:
    needs: [radar, meso]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Download REF radar stage
        uses: actions/download-artifact@v4
        with:
          name: endymion-radar-REF
          path: .stage/radar-REF

      - name: Download VEL radar stage
        uses: actions/download-artifact@v4
        with:
          name: endymion-radar-VEL
          path: .stage/radar-VEL

      - name: Download CC radar stage
        uses: actions/download-artifact@v4
        with:
          name: endymion-radar-CC
          path: .stage/radar-CC

      - name: Download ZDR radar stage
        uses: actions/download-artifact@v4
        with:
          name: endymion-radar-ZDR
          path: .stage/radar-ZDR

      - name: Download meso stage
        uses: actions/download-artifact@v4
        with:
          name: endymion-meso-stage
          path: .stage/meso

      - name: Assemble and merge participant cache
        run: |
          mkdir -p data/cache/mardi-gras-dss-001/radar/frames
          mkdir -p data/cache/mardi-gras-dss-001

          for product in REF VEL CC ZDR; do
            cp -a ".stage/radar-${product}/cache/mardi-gras-dss-001/radar/frames/${product}" \
              data/cache/mardi-gras-dss-001/radar/frames/
          done

          cp -a .stage/meso/cache/mardi-gras-dss-001/meso data/cache/mardi-gras-dss-001/
          cp .stage/radar-REF/raw-case-inventory-radar.json data/
          cp .stage/meso/raw-case-inventory-meso.json data/

          python - <<'PY'
          import json
          from pathlib import Path

          products = ["REF", "VEL", "CC", "ZDR"]
          manifests = []
          for product in products:
              path = Path(f".stage/radar-{product}/cache/mardi-gras-dss-001/radar/manifest.json")
              manifests.append(json.loads(path.read_text(encoding="utf-8")))

          merged = dict(manifests[0])
          merged["products"] = [
              item
              for manifest in manifests
              for item in manifest.get("products", [])
          ]
          merged["frames"] = sorted(
              [
                  frame
                  for manifest in manifests
                  for frame in manifest.get("frames", [])
              ],
              key=lambda frame: (
                  frame["timestamp"],
                  frame["product"],
                  frame["elevation"],
              ),
          )
          Path("data/cache/mardi-gras-dss-001/radar/manifest.json").write_text(
              json.dumps(merged, indent=2) + "\n",
              encoding="utf-8",
          )

          radar = json.loads(Path("data/raw-case-inventory-radar.json").read_text())
          meso = json.loads(Path("data/raw-case-inventory-meso.json").read_text())
          meso["datasets"]["nexrad"] = radar["datasets"]["nexrad"]
          Path("data/raw-case-inventory.json").write_text(
              json.dumps(meso, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Final case-blindness and product validation
        run: python scripts/validate_exercise_cache.py

      - name: Write build metadata
        run: |
          {
            echo "scenario=mardi-gras-dss-001"
            echo "source_case=2022-12-14"
            echo "exercise_date=2027-02-06"
            echo "lightningcast=not_included_external_cspp_step"
            echo "commit=${GITHUB_SHA}"
          } > data/BUILD_INFO.txt

      - uses: actions/upload-artifact@v4
        with:
          name: endymion-case-cache-no-lightningcast
          path: |
            data/cache/mardi-gras-dss-001
            data/raw-case-inventory.json
            data/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
