name: Full Endymion Case Build

on:
  workflow_dispatch:

jobs:
  radar:
    strategy:
      fail-fast: false
      matrix:
        product: [REF, VEL, CC, ZDR]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-data.txt

      - name: Install radar dependencies
        run: pip install -r scripts/requirements-data.txt

      - name: Download KLIX Level II source data
        run: python scripts/prepare_endymion_case.py --scope radar --skip-lightningcast-inputs

      - name: Validate radar source inventory
        run: |
          python scripts/validate_case_inventory.py \
            --strict \
            --scope radar \
            --skip-lightningcast-inputs \
            --json data/raw-case-inventory-radar.json

      - name: Build radar product
        run: |
          python scripts/build_radar_cache.py \
            --scenario-id mardi-gras-dss-001 \
            --input data/raw/nexrad/20210512 \
            --site KLIX \
            --products ${{ matrix.product }} \
            --elevations 0.5 0.9 1.3 \
            --range-km 230 \
            --simulation-date 2027-02-06 \
            --timezone America/Chicago \
            --local-time-offset-minutes 825

      - uses: actions/upload-artifact@v4
        with:
          name: endymion-radar-${{ matrix.product }}
          path: |
            data/cache/mardi-gras-dss-001/radar
            data/raw-case-inventory-radar.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 6

  goes:
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: goes_ir
            channel: 13
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install meso rendering dependencies
        run: pip install boto3 matplotlib cartopy numpy xarray netCDF4

      - name: Download GOES channel
        run: |
          python scripts/fetch_goes.py \
            --satellite 16 \
            --date 2021-05-12 \
            --start 06:00 \
            --end 07:45 \
            --product ABI-L2-CMIPC \
            --channels ${{ matrix.channel }} \
            --output data/raw/goes/${{ matrix.id }}

      - name: Verify GOES source coverage
        run: |
          count=$(find data/raw/goes/${{ matrix.id }} -type f | wc -l)
          echo "Downloaded ${count} GOES files"
          test "${count}" -ge 20

      - name: Render GOES channel
        run: |
          python scripts/render_goes.py \
            --input data/raw/goes/${{ matrix.id }} \
            --output data/raw/meso/${{ matrix.id }} \
            --channel ${{ matrix.channel }} \
            --domain -93 -87 27.5 32.5 \
            --simulation-date 2027-02-06 \
            --local-time-offset-minutes 825

      - name: Verify rendered GOES frames
        run: |
          count=$(find data/raw/meso/${{ matrix.id }} -type f -name '*.png' | wc -l)
          echo "Rendered ${count} ${{ matrix.id }} frames"
          test "${count}" -ge 20

      - name: Package rendered GOES stage
        run: tar -czf ${{ matrix.id }}.tar.gz -C data/raw/meso ${{ matrix.id }}

      - uses: actions/upload-artifact@v4
        with:
          name: endymion-meso-${{ matrix.id }}
          path: ${{ matrix.id }}.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  mrms:
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: mrms_mesh
            product: MESH_00.50
          - id: mrms_azshear
            product: MergedAzShear_0-2kmAGL_00.50
          - id: mrms_precip_rate
            product: PrecipRate_00.00
          - id: mrms_lowest_refl
            product: MergedReflectivityAtLowestAltitude_00.50
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install MRMS rendering dependencies
        run: pip install boto3 matplotlib cartopy numpy pygrib

      - name: Download MRMS product
        run: |
          python scripts/fetch_mrms.py \
            --date 2021-05-12 \
            --start 06:00 \
            --end 07:45 \
            --products ${{ matrix.product }} \
            --output data/raw/mrms

      - name: Verify MRMS source coverage
        run: |
          count=$(find "data/raw/mrms/${{ matrix.product }}" -type f | wc -l)
          echo "Downloaded ${count} MRMS files"
          test "${count}" -ge 50

      - name: Render MRMS product
        run: |
          python scripts/render_mrms.py \
            --input-root data/raw/mrms \
            --output-root data/raw/meso/mrms \
            --products ${{ matrix.product }} \
            --domain -93 -87 27.5 32.5 \
            --simulation-date 2027-02-06 \
            --local-time-offset-minutes 825

      - name: Verify rendered MRMS frames
        run: |
          count=$(find "data/raw/meso/mrms/${{ matrix.product }}" -type f -name '*.png' | wc -l)
          echo "Rendered ${count} ${{ matrix.id }} frames"
          test "${count}" -ge 50

      - name: Package rendered MRMS stage
        run: tar -czf ${{ matrix.id }}.tar.gz -C data/raw/meso "mrms/${{ matrix.product }}"

      - uses: actions/upload-artifact@v4
        with:
          name: endymion-meso-${{ matrix.id }}
          path: ${{ matrix.id }}.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  supporting-meso:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install supporting meso dependencies
        run: pip install boto3 matplotlib cartopy numpy xarray netCDF4 pygrib

      - name: Download GLM, RAP, and surface observations
        run: |
          python scripts/fetch_goes.py \
            --satellite 16 \
            --date 2021-05-12 \
            --start 06:00 \
            --end 07:45 \
            --product GLM-L2-LCFA \
            --output data/raw/goes/glm-lcfa
          python scripts/fetch_rap.py \
            --date 2021-05-12 \
            --cycles 5 6 7 \
            --output data/raw/rap/20210512
          python scripts/fetch_surface_obs.py \
            --network LA_ASOS \
            --stations MSY NEW BTR ASD HDC \
            --date 2021-05-12 \
            --start 06:00 \
            --end 07:45 \
            --output data/raw/observations/asos_20210512.csv

      - name: Verify supporting source coverage
        run: |
          glm=$(find data/raw/goes/glm-lcfa -type f | wc -l)
          rap=$(find data/raw/rap/20210512 -type f | wc -l)
          echo "GLM files: ${glm}; RAP files: ${rap}"
          test "${glm}" -ge 300
          test "${rap}" -ge 3
          test -s data/raw/observations/asos_20210512.csv

      - name: Render GLM
        run: |
          python scripts/render_glm_flash_density.py \
            --input data/raw/goes/glm-lcfa \
            --output data/raw/meso/glm_flash_density \
            --domain -93 -87 27.5 32.5 \
            --simulation-date 2027-02-06 \
            --local-time-offset-minutes 825

      - name: Render RAP environment
        run: |
          python scripts/render_rap_environment.py \
            --input data/raw/rap/20210512 \
            --output-root data/raw/meso \
            --domain -93 -87 27.5 32.5 \
            --simulation-date 2027-02-06 \
            --local-time-offset-minutes 825

      - name: Render surface observations
        run: |
          python scripts/render_surface_obs.py \
            --input data/raw/observations/asos_20210512.csv \
            --output data/raw/meso/surface_obs \
            --start 2021-05-12T06:00Z \
            --end 2021-05-12T07:45Z \
            --domain -93 -87 27.5 32.5 \
            --simulation-date 2027-02-06 \
            --local-time-offset-minutes 825

      - name: Verify supporting rendered frames
        run: |
          test "$(find data/raw/meso/glm_flash_density -type f -name '*.png' | wc -l)" -ge 20
          test "$(find data/raw/meso/mlcape -type f -name '*.png' | wc -l)" -ge 3
          test "$(find data/raw/meso/bulk_shear_0_6km -type f -name '*.png' | wc -l)" -ge 3
          test "$(find data/raw/meso/srh_0_1km -type f -name '*.png' | wc -l)" -ge 3
          test "$(find data/raw/meso/surface_obs -type f -name '*.png' | wc -l)" -ge 10

      - name: Package supporting meso stage
        run: |
          tar -czf supporting-meso.tar.gz -C data/raw/meso \
            glm_flash_density \
            mlcape \
            bulk_shear_0_6km \
            srh_0_1km \
            surface_obs

      - uses: actions/upload-artifact@v4
        with:
          name: endymion-meso-supporting
          path: supporting-meso.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  meso-package:
    needs: [goes, mrms, supporting-meso]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install manifest dependencies
        run: pip install pydantic pyyaml

      - name: Download GOES IR stage
        uses: actions/download-artifact@v4
        with:
          name: endymion-meso-goes_ir
          path: .stage/goes_ir

      - name: Download MRMS MESH stage
        uses: actions/download-artifact@v4
        with:
          name: endymion-meso-mrms_mesh
          path: .stage/mrms_mesh

      - name: Download MRMS AzShear stage
        uses: actions/download-artifact@v4
        with:
          name: endymion-meso-mrms_azshear
          path: .stage/mrms_azshear

      - name: Download MRMS precip-rate stage
        uses: actions/download-artifact@v4
        with:
          name: endymion-meso-mrms_precip_rate
          path: .stage/mrms_precip_rate

      - name: Download MRMS lowest-reflectivity stage
        uses: actions/download-artifact@v4
        with:
          name: endymion-meso-mrms_lowest_refl
          path: .stage/mrms_lowest_refl

      - name: Download supporting meso stage
        uses: actions/download-artifact@v4
        with:
          name: endymion-meso-supporting
          path: .stage/supporting

      - name: Assemble rendered meso sources
        run: |
          mkdir -p data/raw/meso
          tar -xzf .stage/goes_ir/goes_ir.tar.gz -C data/raw/meso
          tar -xzf .stage/mrms_mesh/mrms_mesh.tar.gz -C data/raw/meso
          tar -xzf .stage/mrms_azshear/mrms_azshear.tar.gz -C data/raw/meso
          tar -xzf .stage/mrms_precip_rate/mrms_precip_rate.tar.gz -C data/raw/meso
          tar -xzf .stage/mrms_lowest_refl/mrms_lowest_refl.tar.gz -C data/raw/meso
          tar -xzf .stage/supporting/supporting-meso.tar.gz -C data/raw/meso

      - name: Build meso manifest/cache
        run: |
          python scripts/build_meso_cache.py \
            --scenario-id mardi-gras-dss-001 \
            --config scenarios/mardi-gras/meso-products.yaml \
            --simulation-date 2027-02-06 \
            --timezone America/Chicago \
            --local-time-offset-minutes 825

      - name: Validate meso cache
        run: python scripts/validate_exercise_cache.py --scope meso

      - name: Package meso cache
        run: tar -czf endymion-meso-cache.tar.gz -C data/cache/mardi-gras-dss-001 meso

      - uses: actions/upload-artifact@v4
        with:
          name: endymion-meso-cache
          path: endymion-meso-cache.tar.gz
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  package:
    needs: [radar, meso-package]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Download REF radar stage
        uses: actions/download-artifact@v4
        with:
          name: endymion-radar-REF
          path: .stage/radar-REF

      - name: Download VEL radar stage
        uses: actions/download-artifact@v4
        with:
          name: endymion-radar-VEL
          path: .stage/radar-VEL

      - name: Download CC radar stage
        uses: actions/download-artifact@v4
        with:
          name: endymion-radar-CC
          path: .stage/radar-CC

      - name: Download ZDR radar stage
        uses: actions/download-artifact@v4
        with:
          name: endymion-radar-ZDR
          path: .stage/radar-ZDR

      - name: Download meso cache stage
        uses: actions/download-artifact@v4
        with:
          name: endymion-meso-cache
          path: .stage/meso-cache

      - name: Assemble participant cache
        run: |
          mkdir -p data/cache/mardi-gras-dss-001/radar/frames
          mkdir -p data/cache/mardi-gras-dss-001

          for product in REF VEL CC ZDR; do
            cp -a ".stage/radar-${product}/cache/mardi-gras-dss-001/radar/frames/${product}" \
              data/cache/mardi-gras-dss-001/radar/frames/
          done

          tar -xzf .stage/meso-cache/endymion-meso-cache.tar.gz \
            -C data/cache/mardi-gras-dss-001

          python - <<'PY'
          import json
          from pathlib import Path

          products = ["REF", "VEL", "CC", "ZDR"]
          manifests = []
          for product in products:
              path = Path(f".stage/radar-{product}/cache/mardi-gras-dss-001/radar/manifest.json")
              manifests.append(json.loads(path.read_text(encoding="utf-8")))

          merged = dict(manifests[0])
          merged["products"] = [
              item
              for manifest in manifests
              for item in manifest.get("products", [])
          ]
          merged["frames"] = sorted(
              [
                  frame
                  for manifest in manifests
                  for frame in manifest.get("frames", [])
              ],
              key=lambda frame: (
                  frame["timestamp"],
                  frame["product"],
                  frame["elevation"],
              ),
          )
          Path("data/cache/mardi-gras-dss-001/radar/manifest.json").write_text(
              json.dumps(merged, indent=2) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Final case-blindness and product validation
        run: python scripts/validate_exercise_cache.py

      - name: Write build metadata
        run: |
          {
            echo "scenario=mardi-gras-dss-001"
            echo "source_case=2021-05-12"
            echo "exercise_date=2027-02-06"
            echo "lightningcast=not_included_external_cspp_step"
            echo "commit=${GITHUB_SHA}"
          } > data/BUILD_INFO.txt

      - uses: actions/upload-artifact@v4
        with:
          name: endymion-case-cache-no-lightningcast
          path: |
            data/cache/mardi-gras-dss-001
            data/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
