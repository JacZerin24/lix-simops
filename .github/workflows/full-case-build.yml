name: Full Endymion Case Build

on:
  pull_request:
    paths:
      - ".github/workflows/full-case-build.yml"
      - "scripts/validate_case_inventory.py"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements-data.txt

      - name: Install case-building dependencies
        run: pip install -r scripts/requirements-data.txt

      - name: Download public source-case data
        run: python scripts/prepare_endymion_case.py --skip-lightningcast-inputs

      - name: Validate raw source-case inventory
        run: |
          python scripts/validate_case_inventory.py \
            --strict \
            --skip-lightningcast-inputs \
            --json data/raw-case-inventory.json

      - name: Build participant-facing radar and meso caches
        run: python scripts/build_endymion_case.py

      - name: Final case-blindness and product validation
        run: python scripts/validate_exercise_cache.py

      - name: Write build metadata
        run: |
          {
            echo "scenario=mardi-gras-dss-001"
            echo "source_case=2022-12-14"
            echo "exercise_date=2027-02-06"
            echo "lightningcast=not_included_external_cspp_step"
            echo "commit=${GITHUB_SHA}"
          } > data/BUILD_INFO.txt

      - uses: actions/upload-artifact@v4
        with:
          name: endymion-case-cache-no-lightningcast
          path: |
            data/cache/mardi-gras-dss-001
            data/raw-case-inventory.json
            data/BUILD_INFO.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 6
