name: Build Portable Windows SimOps

on:
  workflow_dispatch:
    inputs:
      app_only:
        description: Build app-only update for an existing SimOps installation (no weather cache rebuild)
        required: true
        type: boolean
        default: true
      case_run_id:
        description: Full Endymion Case Build run ID (only used when app_only is unchecked)
        required: false
        default: "36658715392"
      include_meso_addons:
        description: Restore verified LightningCast (42 images) and KMSY sounding from the checked-in workshop addon ZIP (full package only)
        required: false
        type: boolean
        default: false
permissions:
  contents: read
  actions: read

env:
  CASE_RUN_ID: ${{ github.event.inputs.case_run_id || '36658715392' }}

jobs:
  package:
    if: ${{ !inputs.app_only }}
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build React frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Download validated Endymion weather cache
        uses: actions/download-artifact@v4
        with:
          name: endymion-case-cache-no-lightningcast
          path: .case
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ env.CASE_RUN_ID }}

      - name: Assemble portable application
        shell: pwsh
        run: |
          $dest = Join-Path $PWD "portable-build\LIX-SimOps"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          New-Item -ItemType Directory -Force -Path "$dest\frontend" | Out-Null
          New-Item -ItemType Directory -Force -Path "$dest\scripts" | Out-Null
          New-Item -ItemType Directory -Force -Path "$dest\data\cache" | Out-Null

          Copy-Item backend "$dest\backend" -Recurse
          Remove-Item "$dest\backend\tests" -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item simulator "$dest\simulator" -Recurse
          Copy-Item scenarios "$dest\scenarios" -Recurse
          Remove-Item "$dest\scenarios\mardi-gras\source-case.yaml" -Force -ErrorAction SilentlyContinue
          Copy-Item frontend\dist "$dest\frontend\dist" -Recurse
          Copy-Item scripts\validate_exercise_cache.py "$dest\scripts\validate_exercise_cache.py"
          Copy-Item portable\windows\START_SIMOPS.bat "$dest\START_SIMOPS.bat"
          Copy-Item portable\windows\START_SIMOPS_LAN.bat "$dest\START_SIMOPS_LAN.bat"
          Copy-Item portable\windows\README-PORTABLE.txt "$dest\README-PORTABLE.txt"
          Copy-Item portable\windows\portable-requirements.txt "$dest\portable-requirements.txt"

          if (-not (Test-Path ".case\cache\mardi-gras-dss-001")) {
            throw "Downloaded case artifact does not contain cache/mardi-gras-dss-001"
          }
          Copy-Item ".case\cache\mardi-gras-dss-001" "$dest\data\cache\mardi-gras-dss-001" -Recurse
          # BUILD_INFO and source-case.yaml intentionally stay out of the portable
          # participant runtime because they reveal the historical source case.
          @(
            "scenario=mardi-gras-dss-001"
            "exercise_date=2027-02-06"
            "case_run_id=$env:CASE_RUN_ID"
            "app_commit=$env:GITHUB_SHA"
          ) | Set-Content "$dest\PACKAGE_INFO.txt"

      - name: Restore verified LightningCast and KMSY sounding (optional)
        if: ${{ inputs.include_meso_addons }}
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $archive = Join-Path $PWD "weather-addons/Endymion_LightningCast_Sounding_Restore.zip"
          if (-not (Test-Path $archive)) {
            throw "Missing verified Meso add-on ZIP in GitHub checkout. See weather-addons/README.md before enabling include_meso_addons."
          }
          $expected = "bb8ec7c30b99f1232ef53ea94fbcf53740f822a8b30b7603403c23245c8fe328"
          $actual = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          if ($actual -ne $expected) {
            throw "Workshop Meso add-on ZIP SHA-256 mismatch. Refusing to merge unchecked or modified images."
          }
          $expanded = Join-Path $PWD ".addon-stage"
          New-Item -ItemType Directory -Path $expanded -Force | Out-Null
          Expand-Archive -LiteralPath $archive -DestinationPath $expanded -Force
          $installer = Join-Path $expanded "RESTORE_ENDYMION_ADDONS.py"
          if (-not (Test-Path $installer)) {
            throw "Verified addon ZIP does not contain RESTORE_ENDYMION_ADDONS.py"
          }
          $portable = Join-Path $PWD "portable-build/LIX-SimOps"
          python $installer --target $portable --source $expanded
          if ($LASTEXITCODE -ne 0) {
            throw "Verified Meso weather add-on merge failed."
          }
          Write-Host "Merged 21 LightningCast, 21 LightningCast+MRMS, and 1 case-blind RAP sounding into full package."

      - name: Reject historical source-case leakage
        shell: pwsh
        run: |
          $dest = Join-Path $PWD "portable-build\LIX-SimOps"
          if (Test-Path "$dest\scenarios\mardi-gras\source-case.yaml") {
            throw "Portable runtime contains facilitator-only source-case.yaml"
          }
          if (Test-Path "$dest\BUILD_INFO.txt") {
            throw "Portable runtime contains facilitator-only BUILD_INFO.txt"
          }
          $textExtensions = @(".py", ".yaml", ".yml", ".json", ".txt", ".tsx", ".ts", ".js", ".html", ".css", ".md")
          $files = Get-ChildItem $dest -Recurse -File |
            Where-Object { $textExtensions -contains $_.Extension.ToLowerInvariant() }
          $leaks = @()
          foreach ($needle in @("2021-05-12", "20210512", "2021132")) {
            $leaks += $files | Select-String -SimpleMatch $needle -List
          }
          if ($leaks) {
            $leaks | Select-Object -ExpandProperty Path -Unique | ForEach-Object { Write-Host $_ }
            throw "Portable runtime contains historical source-case identifiers"
          }

      - name: Assemble source-only app update
        shell: pwsh
        run: |
          $source = Join-Path $PWD "portable-build\LIX-SimOps"
          $update = Join-Path $PWD "portable-update\LIX-SimOps"

          New-Item -ItemType Directory -Force -Path $update | Out-Null
          New-Item -ItemType Directory -Force -Path "$update\frontend" | Out-Null
          New-Item -ItemType Directory -Force -Path "$update\scripts" | Out-Null

          Copy-Item "$source\backend" "$update\backend" -Recurse
          Copy-Item "$source\simulator" "$update\simulator" -Recurse
          Copy-Item "$source\scenarios" "$update\scenarios" -Recurse
          Copy-Item "$source\frontend\dist" "$update\frontend\dist" -Recurse
          Copy-Item "$source\scripts\validate_exercise_cache.py" "$update\scripts\validate_exercise_cache.py"
          Copy-Item "$source\PACKAGE_INFO.txt" "$update\PACKAGE_INFO.txt"
          Copy-Item "portable\windows\README-APP-UPDATE.txt" "$update\README-APP-UPDATE.txt"

          @(
            "update_type=app_only"
            "requires_existing_portable_install=true"
            "requires_existing_case_run_id=$env:CASE_RUN_ID"
            "app_commit=$env:GITHUB_SHA"
            "contains_weather_cache=false"
            "contains_python_wheelhouse=false"
            "contains_launcher=false"
          ) | Set-Content "$update\APP_UPDATE_INFO.txt"

      - name: Verify source-only update contains no installer or compiled payloads
        shell: pwsh
        run: |
          $update = Join-Path $PWD "portable-update\LIX-SimOps"
          $blockedExtensions = @(".bat", ".cmd", ".ps1", ".exe", ".msi", ".dll", ".pyd", ".whl")
          $blocked = Get-ChildItem $update -Recurse -File |
            Where-Object { $blockedExtensions -contains $_.Extension.ToLowerInvariant() }
          if ($blocked) {
            $blocked | Select-Object -ExpandProperty FullName | ForEach-Object { Write-Host $_ }
            throw "Source-only update contains an installer, launcher, compiled binary, or wheel."
          }
          if (Test-Path "$update\wheelhouse") {
            throw "Source-only update unexpectedly contains a wheelhouse."
          }
          if (Test-Path "$update\data\cache") {
            throw "Source-only update unexpectedly contains a weather cache."
          }
          if (Test-Path "$update\scenarios\mardi-gras\source-case.yaml") {
            throw "Source-only update contains facilitator-only source-case.yaml."
          }

          $textExtensions = @(".py", ".yaml", ".yml", ".json", ".txt", ".js", ".html", ".css", ".md")
          $files = Get-ChildItem $update -Recurse -File |
            Where-Object { $textExtensions -contains $_.Extension.ToLowerInvariant() }
          $leaks = @()
          foreach ($needle in @("2021-05-12", "20210512", "2021132")) {
            $leaks += $files | Select-String -SimpleMatch $needle -List
          }
          if ($leaks) {
            $leaks | Select-Object -ExpandProperty Path -Unique | ForEach-Object { Write-Host $_ }
            throw "Source-only update contains historical source-case identifiers."
          }

      - name: Build offline Python wheelhouse
        shell: pwsh
        run: |
          $dest = Join-Path $PWD "portable-build\LIX-SimOps"
          New-Item -ItemType Directory -Force -Path "$dest\wheelhouse" | Out-Null
          python -m pip install --upgrade pip
          python -m pip download --only-binary=:all: --dest "$dest\wheelhouse" -r "$dest\portable-requirements.txt"

      - name: Test package with offline-only install
        shell: pwsh
        run: |
          $dest = Join-Path $PWD "portable-build\LIX-SimOps"
          python -m venv .portable-test
          $testPython = Join-Path $PWD ".portable-test\Scripts\python.exe"

          & $testPython -m pip install --no-index --find-links "$dest\wheelhouse" -r "$dest\portable-requirements.txt"

          Push-Location $dest
          $checks = @()
          if ("${{ inputs.include_meso_addons }}" -eq "true") {
            $checks = @("--require-lightningcast", "--require-startup-radar")
          }
          & $testPython scripts\validate_exercise_cache.py @checks
          if ($LASTEXITCODE -ne 0) {
            Pop-Location
            throw "Portable cache validation failed."
          }
          Pop-Location

          $server = Start-Process -FilePath $testPython -ArgumentList "-m","uvicorn","backend.app.main:app","--host","127.0.0.1","--port","8765" -WorkingDirectory $dest -PassThru
          try {
            Start-Sleep -Seconds 4
            $health = Invoke-WebRequest "http://127.0.0.1:8765/health" -UseBasicParsing
            if ($health.StatusCode -ne 200) { throw "Health endpoint failed." }
            $homeResponse = Invoke-WebRequest "http://127.0.0.1:8765/" -UseBasicParsing
            if ($homeResponse.StatusCode -ne 200 -or $homeResponse.Content -notmatch "LIX SimOps") {
              throw "Prebuilt frontend was not served by FastAPI."
            }
          }
          finally {
            if ($server -and -not $server.HasExited) {
              Stop-Process -Id $server.Id -Force
            }
          }

      - name: Test actual portable launcher preflight
        shell: cmd
        working-directory: portable-build\LIX-SimOps
        run: START_SIMOPS.bat CHECK

      - name: Upload full portable package
        uses: actions/upload-artifact@v4
        with:
          name: LIX-SimOps-Portable-Windows
          path: portable-build/LIX-SimOps
          if-no-files-found: error
          retention-days: 45
          compression-level: 0

      - name: Upload source-only app update
        uses: actions/upload-artifact@v4
        with:
          name: LIX-SimOps-App-Update
          path: portable-update/LIX-SimOps
          if-no-files-found: error
          retention-days: 45

  app-update:
    if: ${{ inputs.app_only }}
    name: Build app-only update
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build React frontend
        working-directory: frontend
        run: |
          npm install
          npm run build

      - name: Assemble source-only app update
        shell: pwsh
        run: |
          $update = Join-Path $PWD "portable-update\LIX-SimOps"
          New-Item -ItemType Directory -Force -Path $update | Out-Null
          New-Item -ItemType Directory -Force -Path "$update\frontend" | Out-Null
          New-Item -ItemType Directory -Force -Path "$update\scripts" | Out-Null

          Copy-Item backend "$update\backend" -Recurse
          Remove-Item "$update\backend\tests" -Recurse -Force -ErrorAction SilentlyContinue
          Copy-Item simulator "$update\simulator" -Recurse
          Copy-Item scenarios "$update\scenarios" -Recurse
          Remove-Item "$update\scenarios\mardi-gras\source-case.yaml" -Force -ErrorAction SilentlyContinue
          Copy-Item frontend\dist "$update\frontend\dist" -Recurse
          Copy-Item scripts\validate_exercise_cache.py "$update\scripts\validate_exercise_cache.py"
          Copy-Item portable\windows\README-APP-UPDATE.txt "$update\README-APP-UPDATE.txt"

          @(
            "scenario=mardi-gras-dss-001"
            "exercise_date=2027-02-06"
            "case_run_id=preserved-existing-install"
            "app_commit=$env:GITHUB_SHA"
          ) | Set-Content "$update\PACKAGE_INFO.txt"

          @(
            "update_type=app_only"
            "requires_existing_portable_install=true"
            "requires_existing_case_run_id=preserved-existing-install"
            "app_commit=$env:GITHUB_SHA"
            "contains_weather_cache=false"
            "contains_python_wheelhouse=false"
            "contains_launcher=false"
          ) | Set-Content "$update\APP_UPDATE_INFO.txt"

      - name: Verify app-only update contents and protect source-case secrecy
        shell: pwsh
        run: |
          $update = Join-Path $PWD "portable-update\LIX-SimOps"
          foreach ($required in @(
            "backend\app\main.py",
            "simulator",
            "scenarios",
            "frontend\dist\index.html",
            "scripts\validate_exercise_cache.py",
            "PACKAGE_INFO.txt",
            "APP_UPDATE_INFO.txt",
            "README-APP-UPDATE.txt"
          )) {
            if (-not (Test-Path "$update\$required")) {
              throw "App-only update missing required path: $required"
            }
          }
          $blockedExtensions = @(".bat", ".cmd", ".ps1", ".exe", ".msi", ".dll", ".pyd", ".whl")
          $blocked = Get-ChildItem $update -Recurse -File |
            Where-Object { $blockedExtensions -contains $_.Extension.ToLowerInvariant() }
          if ($blocked) {
            $blocked | Select-Object -ExpandProperty FullName -Unique | ForEach-Object { Write-Host $_ }
            throw "App-only update contains disallowed executable or binary content."
          }
          foreach ($excluded in @(
            "wheelhouse",
            "data\cache",
            "scenarios\mardi-gras\source-case.yaml",
            "BUILD_INFO.txt"
          )) {
            if (Test-Path "$update\$excluded") {
              throw "App-only update contains disallowed path: $excluded"
            }
          }
          $textExtensions = @(".py", ".yaml", ".yml", ".json", ".txt", ".js", ".html", ".css", ".md")
          $files = Get-ChildItem $update -Recurse -File |
            Where-Object { $textExtensions -contains $_.Extension.ToLowerInvariant() }
          $leaks = @()
          foreach ($needle in @("2021-05-12", "20210512", "2021132")) {
            $leaks += $files | Select-String -SimpleMatch $needle -List
          }
          if ($leaks) {
            $leaks | Select-Object -ExpandProperty Path -Unique | ForEach-Object { Write-Host $_ }
            throw "App-only update contains historical source-case identifiers."
          }

      - name: Upload app-only update
        uses: actions/upload-artifact@v4
        with:
          name: LIX-SimOps-App-Update
          path: portable-update/LIX-SimOps
          if-no-files-found: error
          retention-days: 45
