name: Endymion GLM Threshold Rings Addon

on:
  push:
    branches: [feature/radar-operations-v1]
    paths:
      - ".github/workflows/endymion-glm-ring-addon.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: endymion-glm-ring-addon
  cancel-in-progress: false

jobs:
  render-and-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install GOES and map libraries
        run: pip install boto3 matplotlib cartopy numpy xarray netCDF4 pyyaml
      - name: Download original GOES-16 GLM flash-centroid data
        run: |
          python scripts/fetch_goes.py \
            --satellite 16 --date 2021-05-12 \
            --start 06:00 --end 07:45 \
            --product GLM-L2-LCFA \
            --output data/raw/goes/glm-lcfa
      - name: Render paired GLM maps using real scenario 8/12/15-mile thresholds
        run: |
          python scripts/render_glm_flash_density.py \
            --input data/raw/goes/glm-lcfa \
            --output data/raw/meso/glm_flash_density \
            --ring-output data/raw/meso/glm_flash_density_rings \
            --event-config scenarios/mardi-gras/event.yaml \
            --domain -93 -87 27.5 32.5 \
            --simulation-date 2027-02-06 \
            --local-time-offset-minutes 825
      - name: Verify paired GLM images
        run: |
          set -euo pipefail
          plain="$(find data/raw/meso/glm_flash_density -type f -name '*.png' | wc -l)"
          ringed="$(find data/raw/meso/glm_flash_density_rings -type f -name '*.png' | wc -l)"
          echo "Observed GLM=$plain, ring overlay=$ringed"
          test "$plain" -ge 20
          test "$ringed" -eq "$plain"
      - name: Package a case-blind GLM weather add-on
        run: |
          python scripts/package_glm_ring_addon.py \
            --rings data/raw/meso/glm_flash_density_rings \
            --installer scripts/install_glm_ring_addon.py \
            --output dist/LIX-SimOps-GLM-Range-Rings-Addon.zip
      - name: Validate ZIP secrecy and repeated manifest merge
        run: |
          python - <<'PY'
          from pathlib import Path
          from tempfile import TemporaryDirectory
          from zipfile import ZipFile
          import json, subprocess, sys
          p = Path("dist/LIX-SimOps-GLM-Range-Rings-Addon.zip")
          with ZipFile(p) as bundle:
              entries = bundle.namelist()
              assert len(entries) >= 24
              assert all("20210512" not in entry and "2021-05-12" not in entry for entry in entries)
              patch = json.loads(bundle.read("GLM_RINGS_ADDON_MANIFEST.json"))
              assert len(patch["frames"]) >= 20
              assert all(frame["timestamp"].startswith("2027-02-06") for frame in patch["frames"])
              with TemporaryDirectory() as temp:
                  root = Path(temp)
                  bundle.extractall(root)
                  (root / "START_SIMOPS.bat").write_text("@echo off\n")
                  manifest_path = root / "data/cache/mardi-gras-dss-001/meso/manifest.json"
                  existing = {
                      "products": [
                          {"id": "glm_flash_density", "label": "GLM"},
                          {"id": "lightningcast", "label": "LightningCast"},
                      ],
                      "frames": [
                          {"timestamp": item["timestamp"],
                           "product": "glm_flash_density", "asset": "meso/frames/base.png"}
                          for item in patch["frames"]
                      ] + [
                          {"timestamp": patch["frames"][0]["timestamp"],
                           "product": "lightningcast", "asset": "meso/frames/lc.png"}
                      ],
                  }
                  manifest_path.write_text(json.dumps(existing))
                  for _ in range(2):
                      subprocess.run([sys.executable, str(root / "INSTALL_GLM_RINGS.py")],
                                     cwd=root, check=True)
                  result=json.loads(manifest_path.read_text())
                  assert len(result["frames"]) == 2*len(patch["frames"]) + 1
                  assert {p["id"] for p in result["products"]} == {
                      "glm_flash_density", "glm_flash_density_rings", "lightningcast"
                  }
          print("Case-blind GLM ring add-on validated, including repeated installation.")
          PY
      - name: Publish weather add-on ZIP through GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="glm-range-rings-${GITHUB_RUN_ID}"
          gh release create "$tag" dist/LIX-SimOps-GLM-Range-Rings-Addon.zip \
            --target "$GITHUB_SHA" \
            --title "Endymion GLM 8/12/15-mile range-ring map layer" \
            --notes "Exercise-time GLM ring map layer and checksum-verified manifest installer only. Use with the matching app-only update."
          echo "RING_ADDON_RELEASE=$tag"
